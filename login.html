<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">
  <title>Login</title>
  <link rel="stylesheet" href="css/login_register_stylesheet.css">
  <script defer src="js/login.js"></script>
</head>
<body>
  <div class="wrapper">
    <img src="/Images/Rent Connect MeGIF.gif" alt="Rent Connect" style="max-width:min(500px, 90%); border-radius: 20px;">
    <h1>Login to Rent Connect</h1>
    <p id="error-message" style="color: red;"></p>
    <p id="success-message" style="color: green;"></p>
    <form id="login-form">
      <div>
        <label for="email-input">
          <span>@</span>
        </label>
        <input type="email" name="email" id="email-input" placeholder="Email" required>
      </div>
      <div>
        <label for="password-input">
          <svg xmlns="http://www.w3.org/2000/svg" height="24" viewBox="0 -960 960 960" width="24">
            <path d="M240-80q-33 0-56.5-23.5T160-160v-400q0-33 23.5-56.5T240-640h40v-80q0-83 58.5-141.5T480-920q83 0 141.5 58.5T680-720v80h40q33 0 56.5 23.5T800-560v400q0 33-23.5 56.5T720-80H240Zm240-200q33 0 56.5-23.5T560-360q0-33-23.5-56.5T480-440q-33 0-56.5 23.5T400-360q0 33 23.5 56.5T480-280ZM360-640h240v-80q0-50-35-85t-85-35q-50 0-85 35t-35 85v80Z" />
          </svg>
        </label>
        <input type="password" name="password" id="password-input" placeholder="Password" required>
      </div>
      <button type="submit">Login</button>
    </form>

    <!-- Sign-up link -->
    <p style="margin-top: 20px; text-align: center;">
      Don’t have an account? <a href="/signup.html" style="color: #007BFF; text-decoration: none;">Sign up</a>
    </p>
  </div>

  <script>
    document.getElementById('login-form').addEventListener('submit', async function (event) {
      event.preventDefault(); // Prevent the form from submitting traditionally
  
      const email = document.getElementById('email-input').value;
      const password = document.getElementById('password-input').value;
      const errorMessage = document.getElementById('error-message');
      const successMessage = document.getElementById('success-message');
  
      errorMessage.textContent = '';
      successMessage.textContent = '';
  
      try {
        const response = await fetch('https://rent-api.demobykiranpal.in/api/v1/user-auth/login', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            email_address: email,
            password: password
          })
        });
  
        const result = await response.json();
  
        if (response.status === 200) {
          successMessage.textContent = result.message;
          console.log('Token:', result.data.token);
          localStorage.setItem('authToken', result.data.token);
          const role = result.data.role || 'tenants';
  
          if (role === 'property-owners') {
            window.location.href = '/property-owners/my-dashboard-tab.html';
          } else {
            window.location.href = '/tenants/my-dashboard-tab.html';
          }
        } else {
          errorMessage.textContent = result.message || 'Login failed. Please try again.';
        }
      } catch (error) {
        console.error('Error:', error);
        errorMessage.textContent = 'An error occurred. Please try again.';
      }
    });
  </script>
</body>
</html>
